name: Build APK and attach to Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # Safety: ensure the wrapper jar exists in CI
      - name: Ensure Gradle wrapper jar
        run: |
          mkdir -p "app-financeme/gradle/wrapper"
          curl -fsSL -o "app-financeme/gradle/wrapper/gradle-wrapper.jar" \
            "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"

      - name: Build debug APK
        working-directory: app-financeme
        run: ./gradlew :app:assembleDebug

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app-financeme/app/build/outputs/apk/debug/app-debug.apk
